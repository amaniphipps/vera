# GroupMe guardrail profile.
# Group-scoped. Every action is bounded to allowlisted groups; Vera never
# scans or posts outside them.

platform: groupme                   # platform key, lowercase; matches setup choices

routing:
  onboard_group: ""                 # group ID Vera onboards into (GroupMe group ID)
  reply_target: group               # replies land in the group where the message arrived

delivery:
  group_scoped: true                # every read and write is scoped to the allowlist below
  markdown: false                   # GroupMe does not render markdown; plain text only
  rich_files: false                 # no file uploads; text summaries only

guardrails:
  read_posture: group-scoped        # reads only allowlisted groups; nothing else
  reply_defaults: short-reply       # terse, single-answer replies; groups scroll fast
  allowlist: []                     # group IDs Vera may act in; empty = she does nothing until you add one