# Visuals skill: org-specific slots. Fill in per deployment.

# --- Diagram style defaults ---
diagram:
  font: virgil       # hand-drawn font used by Excalidraw
  stroke_width: 2
  roughness: 1       # 0 = crisp, 1 = hand-drawn
  palette: pastel    # palette name documented in references/excalidraw.md

# --- Brand tokens ---
brand:
  token_source: figma   # where brand tokens come from: figma | css | manual
  # When token_source is figma, set the file and team slots below.

# --- Figma file / team slots (read-only) ---
figma:
  team: ""               # team key or id, if tokens live in a team library
  design_system_file: "" # file key of the design system / token source
  recency_months: 12     # ignore files older than this