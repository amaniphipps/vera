# Vera Reporting: org-specific slots. Fill in per deployment.

# --- Theme tokens (applied as CSS variables on :root) ---
theme:
  accent: "#3559D6"        # primary accent: section underlines, bar fills, active states
  accent_2: "#0F8A75"      # secondary accent: secondary series, teal/positive variant
  ink: "#1B1F27"           # body and headline text
  paper: "#F4F5F7"         # page background
  surface: "#FFFFFF"       # card and table background
  line: "#DDE1E6"          # card and table borders
  good: "#1F9D55"          # positive signal
  warn: "#B7791F"          # watch
  risk: "#C53030"          # loss or risk

# --- Fonts (system stack fallback is fine; offline renders correctly) ---
fonts:
  display: "system-ui, -apple-system, 'Segoe UI', sans-serif"   # headings and big numbers
  ui: "system-ui, -apple-system, 'Segoe UI', sans-serif"        # body and labels
  mono: "ui-monospace, 'SF Mono', Menlo, Consolas, monospace"   # tabular data and meta

# --- Attribution ---
attribution:
  label: "Vera Reporting"   # brand name shown in the footer attribution pill
  organization: ""          # optional org name shown beside the label