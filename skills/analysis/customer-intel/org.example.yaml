# Customer Intelligence - org configuration
# Copy this file to org.yaml and fill in your org's values. Every slot has a
# comment: what it is and where an admin finds it.

# --- Data sources the org actually has ---
# Point at the systems you have. If a source is not connected, leave null and
# the mode will skip it and say what is missing rather than inventing data.
data_sources:
  # Your CRM. Used to check what is already known and to write the canonical
  # note. Read-only unless a specific write is approved.
  # Found in: your CRM admin / API settings.
  crm: "your-crm"
  # Your enrichment tool for firmographics and contacts.
  # Found in: your RevOps tooling stack or vendor list.
  enrichment: "your-enrichment-tool"
  # Your call-recording tool for transcript evidence.
  # Found in: your RevOps tooling stack.
  call_recording: "your-call-recording-tool"
  # Your meeting-notes tool.
  # Found in: your tooling stack.
  meeting_notes: "your-meeting-notes-tool"
  # Your data warehouse for product/usage history.
  # Found in: your data platform.
  warehouse: "your-warehouse"

# --- Accuracy threshold for enriched data ---
# Enriched records (contacts or companies) below this confidence score are
# silently excluded, not flagged. Below a lower cutoff they are never shown.
# Found in: your enrichment tool's documentation of confidence/match scores.
enrichment:
  include_threshold: 90    # include only at or above this score
  never_include_below: 70  # below this, the record does not exist to us

# --- Company profile ---
profile:
  # The order and set of sections for the canonical company profile. Trim or
  # reorder to match what your team finds useful before outreach.
  # Found in: your team's existing research templates, or define here.
  sections:
    - "Executive summary"
    - "Company overview and background"
    - "Recent news and trigger events"
    - "Events and conferences"
    - "Products and services"
    - "Social activity"
  # News/timeline look-back window in months for the "recent" sections.
  # Found in: how far back your team reads for outreach relevance.
  news_window_months: 6

# --- Account research: buyer roles the org targets ---
# The buying roles and title patterns your team goes after, by priority tier.
# Found in: your sales playbook or persona doc. Adjust titles to your market.
buyer_roles:
  tier_1: ["CHRO", "Chief People Officer", "VP People", "VP HR", "Director of People"]
  tier_2: ["VP Employee Experience", "Director Culture", "VP HR Technology", "Director HRIS", "VP Internal Comms"]
  tier_3: ["HR Business Partner", "HR Manager", "People Partner"]
  tier_4: ["CFO", "VP Finance", "IT Director", "CTO", "General Counsel", "Procurement Manager"]

# --- Account journey: what makes a good deliverable ---
journey:
  # Columns the growth timeline should carry, in order.
  # Found in: what your CS or sales leaders want to see in a QBR narrative.
  timeline_columns: ["year", "customer_growth", "usage", "milestone"]
  # Anonymization rule for benchmark sections: name only the target account,
  # anonymize all peer accounts as "Company A..D".
  anonymize_peers: true
  # The two versions: customer-facing (omit risk, competitive, internal friction)
  # and internal (include everything). Switch on the audience the requester names.
  internal_version_includes: ["risk flags", "competitive mentions", "internal friction"]